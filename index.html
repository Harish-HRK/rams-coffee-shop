<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rams Coffee Shop</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <h1 id="shopName">Rams Coffee Shop</h1>
    <nav class="top-nav">
      <a href="admin.html" class="admin-link" aria-label="Go to admin">Admin</a>
    </nav>
  </header>

  <main class="layout">
    <div id="cartToggle" class="cart-toggle" role="button" aria-controls="cart" aria-expanded="false">
      <span>Cart</span>
      <span class="sum" id="toggleSum">₹0.00</span>
    </div>
    <section class="menu-section">
      <div class="categories" role="tablist" aria-label="Categories">
        <button class="category-tab active" data-category="All" role="tab" aria-selected="true">All</button>
        <button class="category-tab" data-category="Tea" role="tab">Tea</button>
        <button class="category-tab" data-category="Coffee" role="tab">Coffee</button>
        <button class="category-tab" data-category="Fresh Juice" role="tab">Fresh Juice</button>
        <button class="category-tab" data-category="Snacks" role="tab">Snacks</button>
        <button class="category-tab" data-category="Herbal Soups" role="tab">Herbal Soups</button>
        <button class="category-tab" data-category="Ice Cream" role="tab">Ice Cream</button>
      </div>

      <div id="menuGrid" class="menu-grid" aria-live="polite"></div>
    </section>

    <aside id="cart" class="cart-section" aria-label="Cart and billing">
      <h2>Cart</h2>
      <div id="cartItems" class="cart-items"></div>
      <div class="totals">
        <div class="row"><span>Subtotal</span><span id="subtotal">₹0.00</span></div>
        <div class="row total"><span>Total</span><span id="total">₹0.00</span></div>
      </div>
      <div class="actions">
        <button id="payNowBtn" class="btn primary">Pay Now</button>
        <button id="printBtn" class="btn">Print Bill</button>
        <button id="clearBtn" class="btn danger">Clear Cart</button>
      </div>
    </aside>
  </main>

  <!-- Pay Now Modal -->
  <div id="payModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="payTitle" hidden>
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="payTitle">Scan to Pay</h3>
        <button id="closePayModal" class="icon-btn" aria-label="Close">×</button>
      </div>
      <div class="modal-body pay-body">
        <img id="paymentQr" src="assets/images/payment-qr.png" alt="Payment QR code" />
        <div class="amount-line">
          <span>Amount:</span>
          <strong id="payAmount">₹0.00</strong>
          <button id="copyAmount" class="btn small">Copy amount</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Print Receipt (hidden) -->
  <section id="receipt" class="receipt" hidden>
    <div class="receipt-inner">
      <h2 id="receiptShopName">Rams Coffee Shop</h2>
      <div class="small" id="receiptShopMeta"></div>
      <div id="receiptItems"></div>
      <hr />
      <div class="row"><span>Subtotal</span><span id="receiptSubtotal">₹0.00</span></div>
      <div class="row total"><span>Total</span><span id="receiptTotal">₹0.00</span></div>
      <div class="meta"><span id="receiptDate"></span><span>Order #<span id="receiptOrderId"></span></span></div>
    </div>
  </section>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <noscript>This app requires JavaScript enabled.</noscript>
</body>
<footer class="footer">
  <p>© <span id="year"></span> Rams Coffee Shop</p>
</footer>
</html>
